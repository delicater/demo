<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · 会员中心</title>
    <!-- 不用任何外部 CSS 库，纯手写优雅样式 -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-card" id="loginCard">

        <!-- 头部 -->
        <div class="login-header">
            <div class="logo">✦</div>
            <h1>欢迎回来</h1>
            <p>登录您的会员账户</p>
        </div>

        <!-- 表单（注意 id 与 JS 对应） -->
        <form id="loginForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label for="account">手机号 / 邮箱</label>
                <input type="text" id="account" placeholder="请输入注册手机号或邮箱" />
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="至少 6 位字母或数字" />
            </div>

            <!-- 提示消息容器（替代 alert） -->
            <div id="messageBox" class="message-box"></div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">登 录</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div class="login-footer">
            还没有账号？ <a href="https://9ygh3.sxhfxcyy.com/#/user/register">立即注册</a>
        </div>
    </div>

    <!-- 抽奖功能卡片（需要先登录获取 token；未登录时由 JS 隐藏） -->
    <div class="login-card draw-card" id="drawCard" hidden>
        <div class="login-header">
            <div class="logo draw-logo">🎁</div>
            <h1>抽奖中心</h1>
            <p>填写抽奖次数 draw_count 后发送</p>
        </div>

        <div class="form-group">
            <label for="drawCount">抽奖次数 (draw_count)</label>
            <input type="number" id="drawCount" value="0" min="0" max="500" step="100"
                placeholder="0、100、200 … 500（按 100 递增）" />
        </div>

        <button type="button" class="btn-login" id="drawBtn">
            <span class="btn-text">发 送 抽 奖</span>
            <div class="spinner"></div>
        </button>

        <!-- 提示 & 请求结果 -->
        <div id="drawMsg" class="message-box"></div>
        <pre id="drawResult" class="result-box"></pre>

        <!-- 退出登录 -->
        <button type="button" class="btn-logout" id="logoutBtn">退出登录</button>
    </div>

    <!-- 嵌入站点页面（手机比例；若该站仍禁止嵌入则显示空白） -->
    <iframe class="site-frame"
        src="https://9ygh3.sxhfxcyy.com/?utm_source=mobile&utm_medium=live&channel=announcement#/"
        title="9ygh3.sxhfxcyy.com" loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>

    <!-- 兜底：iframe 被禁止时点击跳转到站点 -->
    <a class="site-fallback" href="https://9ygh3.sxhfxcyy.com/?utm_source=mobile&utm_medium=live&channel=announcement#/"
        target="_blank" rel="noopener">打不开？点击打开官网 ↗</a>

    <script src="main.js"></script>

</body>

</html>
